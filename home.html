    <script>
        // 验证动画逻辑 (修改为对接Cloudflare Worker)
        (function() {
            // 保留原有的动画DOM结构
            document.write('<div id="v-over" style="position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0d1117,#161b22);display:flex;justify-content:center;align-items:center;z-index:9999;transition:0.4s;"><div style="background:#161b22;border:1px solid #30363d;padding:2.5rem;border-radius:15px;width:90%;max-width:400px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.5);"><h2 style="color:#58a6ff;font-family:sans-serif;">🔒 访问验证中</h2><div style="height:8px;background:#30363d;border-radius:4px;margin:20px 0;overflow:hidden;"><div id="p-bar" style="height:100%;background:linear-gradient(90deg,#238636,#2ea043);width:0%;transition:0.3s;"></div></div><p id="v-stat" style="color:#8b949e;font-size:14px;">正在检查验证状态...</p><button id="re-btn" onclick="goToVerification()" style="display:none;margin-top:15px;padding:10px 20px;background:#238636;color:white;border:none;border-radius:6px;cursor:pointer;">返回验证页</button></div></div>');
            
            let p=0;
            const AUTH_API = 'https://phigros-auth.2663773478.workers.dev';
            
            // 进度条动画
            const iv=setInterval(()=>{
                p+=Math.random()*15;
                if(p>95)p=95;
                document.getElementById('p-bar').style.width=p+'%';
            },150);
            
            // 检查验证状态
            async function checkAuth() {
                const token = new URLSearchParams(location.search).get('token') || sessionStorage.getItem('auth_token');
                
                if (!token) {
                    return { valid: false, reason: 'no-token' };
                }
                
                try {
                    // 先保存token到sessionStorage（如果来自URL）
                    if (new URLSearchParams(location.search).get('token')) {
                        sessionStorage.setItem('auth_token', token);
                        // 清理URL中的token
                        const url = new URL(location);
                        url.searchParams.delete('token');
                        history.replaceState({}, '', url);
                    }
                    
                    const response = await fetch(AUTH_API + '/api/check', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });
                    
                    const data = await response.json();
                    return { valid: data.valid, message: data.message };
                } catch (error) {
                    console.error('验证检查失败:', error);
                    return { valid: false, reason: 'network-error', message: '网络错误' };
                }
            }
            
            // 验证完成处理
            async function handleVerification() {
                clearInterval(iv);
                document.getElementById('p-bar').style.width='95%';
                document.getElementById('v-stat').innerText='正在验证令牌...';
                
                const authResult = await checkAuth();
                
                if (authResult.valid) {
                    document.getElementById('p-bar').style.width='100%';
                    document.getElementById('v-stat').innerText='✅ 验证通过！';
                    
                    setTimeout(() => {
                        document.getElementById('v-over').style.opacity='0';
                        setTimeout(() => {
                            document.getElementById('v-over').remove();
                            if(window.init) init();
                        }, 400);
                    }, 800);
                } else {
                    document.getElementById('v-stat').innerText='❌ ' + (authResult.message || '验证失效');
                    document.getElementById('re-btn').style.display='inline-block';
                    document.getElementById('p-bar').style.background='linear-gradient(90deg,#da3633,#f85149)';
                }
            }
            
            // 延迟执行验证检查，让进度条有动画时间
            setTimeout(handleVerification, 1000);
        })();
        
        // 前往验证页面
        function goToVerification() {
            window.location.href = '/phigros.github.io/index.html';
        }
    </script>

        .dl-bar-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease; }

        /* 图片灯箱样式 */

            // 显示验证状态指示器
            document.getElementById('auth-indicator').style.display = 'flex';
            
            // 事件绑定
            document.addEventListener('click', (e) => {
                const item = e.target.closest('.file-item');
                if (item && e.target.tagName !== 'INPUT') {
                    const cb = item.querySelector('input');
                    cb.checked = !cb.checked;
                }
            });
            
            document.getElementById('search').oninput = (e) => {
                const s = e.target.value.toLowerCase();
                document.querySelectorAll('.song-card').forEach(c => c.style.display = c.dataset.id.toLowerCase().includes(s) ? '' : 'none');
            };
            
            // 定期检查验证状态（每5分钟）
            setInterval(async () => {
                const token = sessionStorage.getItem('auth_token');
                if (!token) {
                    showExpiredMessage();
                    return;
                }
                
                try {
                    const response = await fetch('https://phigros-auth.2663773478.workers.dev/api/check', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });
                    
                    const data = await response.json();
                    if (!data.valid) {
                        showExpiredMessage();
                    }
                } catch (error) {
                    console.error('定期检查失败:', error);
                }
            }, 300000);
        };
        
        // 显示验证过期消息
        function showExpiredMessage() {
            if (confirm('验证已过期，是否返回验证页面？')) {
                goToVerification();
            }
        }
        
        // ========== 灯箱控制 ==========
        function openLightbox(src) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lb-img');
            img.src = src;
            lb.style.display = 'flex';
            setTimeout(() => lb.classList.add('active'), 10);
        }
        
        function closeLightbox() {
            const lb = document.getElementById('lightbox');
            lb.classList.remove('active');
            setTimeout(() => lb.style.display = 'none', 300);
        }
        
        // ========== 下载功能 ==========
        window.toggleAll = function(btn) {
            const cbs = btn.closest('.song-card').querySelectorAll('input[type="checkbox"]');
            const anyUn = Array.from(cbs).some(c => !c.checked);
            cbs.forEach(c => c.checked = anyUn);
        };
        
        function closeDlModal() { 
            document.getElementById('dl-modal').style.display = 'none'; 
        }
        
        async function pack(btn) {
            // 下载前验证检查
            const token = sessionStorage.getItem('auth_token');
            if (!token) {
                alert('验证失效，请重新验证');
                goToVerification();
                return;
            }
            
            try {
                const response = await fetch('https://phigros-auth.2663773478.workers.dev/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await response.json();
                if (!data.valid) {
                    alert('验证已过期，请重新验证后再下载');
                    goToVerification();
                    return;
                }
            } catch (error) {
                console.error('验证检查失败:', error);
                alert('验证检查失败，请稍后重试');
                return;
            }
            
            const card = btn.closest('.song-card');
            const items = Array.from(card.querySelectorAll('.file-item')).filter(i => i.querySelector('input').checked);
            if (!items.length) return alert('请先勾选文件！');
            
            const modal = document.getElementById('dl-modal');
            const pBar = document.getElementById('dl-progress');
            const pText = document.getElementById('dl-text');
            const closeBtn = document.getElementById('dl-btn-close');
            
            modal.style.display = 'flex';
            pBar.style.width = '0%';
            pText.innerText = '准备开始...';
            closeBtn.style.display = 'none';
            
            try {
                const zip = new JSZip();
                let count = 0;
                const total = items.length;
                
                for (const i of items) {
                    const fileName = i.dataset.name;
                    pText.innerText = `正在下载 (${count+1}/${total}): ${fileName}`;
                    
                    const r = await fetch(i.dataset.url);
                    if (!r.ok) throw new Error('下载失败');
                    
                    zip.file(fileName, await r.blob());
                    count++;
                    pBar.style.width = ((count / total) * 100) + '%';
                }
                
                pText.innerText = '正在生成压缩包...';
                const blob = await zip.generateAsync({type:'blob'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = card.dataset.id + ".zip";
                a.click();
                
                pText.innerText = '✅ 打包完成！';
                closeBtn.style.display = 'inline-block';
                setTimeout(() => { if(modal.style.display !== 'none') closeDlModal(); }, 2500);
            } catch(e) { 
                console.error('打包错误:', e);
                pText.innerText = '❌ 错误: ' + e.message;
                closeBtn.style.display = 'inline-block';
            }
        }
    </script>
